name: Compila PossWake A71 APK

on:
  push:
    branches: [main]
    paths:
      - 'PossWake_*.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Recupera il repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installa Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepara Android SDK
        uses: android-actions/setup-android@v3

      - name: Android Platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Estrai automaticamente lo ZIP caricato (metodo Possy)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 1 -type f -name 'PossWake_*.zip' | sort)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Atteso esattamente un file PossWake_*.zip nella root. Trovati: ${#zips[@]}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/posswake-src"
          unzip -q "${zips[0]}" -d "$RUNNER_TEMP/posswake-src"
          test -f "$RUNNER_TEMP/posswake-src/settings.gradle" || { echo 'settings.gradle mancante nello ZIP'; exit 1; }
          echo "SRC_DIR=$RUNNER_TEMP/posswake-src" >> "$GITHUB_ENV"

      - name: Compila l'APK
        shell: bash
        run: |
          cd "$SRC_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Pubblica Artifact 1
        uses: actions/upload-artifact@v4
        with:
          name: Artifact 1
          path: ${{ env.SRC_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
