name: Compila PossWake A71 APK

on:
  push:
    branches: [main]
    paths:
      - 'PossWake_*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Recupera il repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installa Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android Platform 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls "${ANDROID_HOME}/platforms" || true
          ls "${ANDROID_HOME}/build-tools" || true
          SDK_MANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [[ -n "$SDK_MANAGER" ]]; then
            "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "sdkmanager non presente; verifico SDK preinstallato"
            test -f "${ANDROID_HOME}/platforms/android-35/android.jar"
            test -d "${ANDROID_HOME}/build-tools/35.0.0"
          fi

      - name: Estrai automaticamente lo ZIP caricato (metodo Possy)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 1 -type f -name 'PossWake_*.zip' | sort)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Atteso esattamente un file PossWake_*.zip nella root. Trovati: ${#zips[@]}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/posswake-src"
          unzip -q "${zips[0]}" -d "$RUNNER_TEMP/posswake-src"
          test -f "$RUNNER_TEMP/posswake-src/settings.gradle" || { echo 'settings.gradle mancante nello ZIP'; exit 1; }
          echo "SRC_DIR=$RUNNER_TEMP/posswake-src" >> "$GITHUB_ENV"

      - name: Compila l'APK
        shell: bash
        run: |
          cd "$SRC_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Pubblica Artifact 1
        uses: actions/upload-artifact@v4
        with:
          name: Artifact 1
          path: ${{ env.SRC_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Pubblica APK scaricabile direttamente nel repository
        shell: bash
        run: |
          set -euo pipefail
          cp "$SRC_DIR/app/build/outputs/apk/debug/app-debug.apk" "PossConnectionA71.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "PossConnectionA71.apk"
          git rm -f "PossWake_A71_v2.apk" 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Pubblica PossConnectionA71 APK scaricabile direttamente [skip ci]"
            git push origin HEAD:main
          fi
